---
name: root
commands:
  - name: Fr
    cname: cmd_Fr
    summary: "Interact with Frida targets"
    description: >
      Commands for the rz-frida integration covering plugin and session status,
      frida:// URI validation, device, process, and application enumeration,
      and session lifecycle across local, USB, and remote targets.
    details:
      - name: "Session status"
        entries:
          - text: "Frs"
            comment: "Print plugin/session status in plain text"
          - text: "Frsj"
            comment: "Print plugin/session status as JSON"
      - name: "URI grammar"
        entries:
          - text: "Fru "
            arg_str: "frida://attach/local//1234"
            comment: "Validate URI for attaching to local PID 1234"
          - text: "Fru "
            arg_str: "frida://spawn/usb/device-1/com.example.app"
            comment: "Validate URI for spawning an Android package over USB"
          - text: "Fru "
            arg_str: "frida://attach/remote/127.0.0.1:27042/4321"
            comment: "Validate URI for attaching to PID 4321 over remote frida-server"
          - text: "Fruj "
            arg_str: "frida://launch/local///bin/ls"
            comment: "Validate launch URI for /bin/ls and emit JSON"
      - name: "Device enumeration"
        entries:
          - text: "Frdj"
            comment: "Enumerate connected Frida devices as JSON"
      - name: "Process listing"
        entries:
          - text: "Frpj"
            comment: "Enumerate local processes as JSON"
          - text: "Frpj "
            arg_str: "frida://list/usb/device-1/"
            comment: "Enumerate processes on a USB device as JSON"
      - name: "Application listing"
        entries:
          - text: "Fraj"
            comment: "Enumerate local applications as JSON"
          - text: "Fraj "
            arg_str: "frida://apps/usb/device-1/"
            comment: "Enumerate applications on a USB device as JSON"
      - name: "Session control"
        entries:
          - text: "Froj "
            arg_str: "frida://spawn/local///bin/ls"
            comment: "Spawn /bin/ls suspended and open a session"
          - text: "Frrj"
            comment: "Resume the spawned target"
          - text: "Frcj"
            comment: "Close the open session"
      - name: "Script execution"
        entries:
          - text: "Frij"
            comment: "Ping the agent and read its version and target info"
          - text: "Frej "
            arg_str: "Process.arch"
            comment: "Evaluate a JavaScript expression in the target process"
          - text: "Frlj "
            arg_str: "hook.js"
            comment: "Load and evaluate a JavaScript file in the target process"
          - text: "Frmj"
            comment: "Read buffered agent log, error, and send messages"
      - name: "Memory access"
        entries:
          - text: "Frxj "
            arg_str: "0x1000 64"
            comment: "Read 64 bytes of the target memory as hex"
          - text: "Frwj "
            arg_str: "0x1000 deadbeef"
            comment: "Write four bytes into the target memory"
      - name: "Runtime info"
        entries:
          - text: "FrRj"
            comment: "List the target memory ranges"
          - text: "Frtj"
            comment: "List the target threads"
          - text: "FrMj"
            comment: "List the target modules"
          - text: "FrEj "
            arg_str: "libc.so"
            comment: "List the exports of a module"
          - text: "FrIj "
            arg_str: "libc.so"
            comment: "List the imports of a module"
          - text: "FrSj "
            arg_str: "libc.so"
            comment: "List the symbols of a module"
      - name: "Debugging"
        entries:
          - text: "Frbj "
            arg_str: "0x1000"
            comment: "Set a breakpoint at an address"
          - text: "Frbj"
            comment: "List the breakpoints that are set"
          - text: "Frb-j "
            arg_str: "0x1000"
            comment: "Remove a breakpoint, or use * for all"
          - text: "Frgj"
            comment: "Continue a thread parked at a breakpoint"
          - text: "FrBj "
            arg_str: "4242"
            comment: "Report the stop identity of the thread parked at a breakpoint"
          - text: "FrBj "
            arg_str: "4242 pc 0x401000"
            comment: "Set a register on the stopped thread before continuing"
          - text: "FrWj "
            arg_str: "0x1000 8 w"
            comment: "Watch 8 bytes for writes with a hardware watchpoint"
          - text: "FrWj"
            comment: "List the hardware watchpoints that are set"
          - text: "FrW-j "
            arg_str: "0x1000"
            comment: "Remove a watchpoint, or use * for all"
    subcommands:
      - name: Frs
        cname: cmd_Frs
        summary: "Print Frida session status"
        description: >
          Reports whether a session is active and prints the current session
          state (new, resolved, attached, detaching, closed, or error).
          connecting is declared but not published.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: Fru
        cname: cmd_Fru
        summary: "Validate a frida:// URI"
        description: >
          Parses and validates a frida:// URI without contacting any Frida
          device. Useful for verifying URI syntax in scripts or CI before
          attempting to attach.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: uri
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "URI grammar"
            entries:
              - text: "frida://"
                arg_str: "<action>/<transport>/<device>/<target>"
                comment: "Full grammar for the frida:// URI"
              - text: "action   "
                arg_str: "= list | apps | attach | spawn | launch"
                comment: "Operation requested for the session"
              - text: "transport"
                arg_str: "= local | usb | remote"
                comment: "Transport used to reach the Frida target"
              - text: "device   "
                arg_str: "= empty | device-id | host:port"
                comment: "Empty for local, id for USB, host:port for remote"
              - text: "target   "
                arg_str: "= pid | process-name | package-name | executable-path"
                comment: "Target selector required by attach/spawn/launch"
          - name: "Examples"
            entries:
              - text: "Fru "
                arg_str: "frida://attach/local//1234"
                comment: "Attach to local PID 1234"
              - text: "Fru "
                arg_str: "frida://spawn/usb/device-1/com.example.app"
                comment: "Spawn an Android package on a USB device"
              - text: "Fru "
                arg_str: "frida://launch/local///bin/ls"
                comment: "Launch /bin/ls locally (absolute path, three slashes)"
              - text: "Fruj "
                arg_str: "frida://attach/remote/127.0.0.1:27042/4321"
                comment: "Validate remote-attach URI and emit JSON"
      - name: Frd
        cname: cmd_Frd
        summary: "List Frida devices"
        description: >
          Enumerates devices known to the Frida device manager (local, USB, and
          remote) and emits a structured JSON reply.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: Frp
        cname: cmd_Frp
        summary: "List processes on a device"
        description: >
          Enumerates the processes visible to a Frida device and emits a
          structured JSON reply. With no argument it lists the local device, or
          pass a frida:// URI to select a USB or remote device.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: uri
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "Frpj"
                comment: "List local processes as JSON, returns a frida_unavailable error if built without frida-core"
              - text: "Frpj "
                arg_str: "frida://list/usb/device-1/"
                comment: "List processes on a USB device by id"
              - text: "Frpj "
                arg_str: "frida://list/remote/127.0.0.1:27042/"
                comment: "List processes on a remote frida-server"
      - name: Fra
        cname: cmd_Fra
        summary: "List applications on a device"
        description: >
          Enumerates the applications known to a Frida device and emits a
          structured JSON reply. With no argument it lists the local device, or
          pass a frida:// URI to select a USB or remote device. Application
          listing is most useful for Android and iOS targets reached over USB.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: uri
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "Fraj"
                comment: "List local applications as JSON, returns a frida_unavailable error if built without frida-core"
              - text: "Fraj "
                arg_str: "frida://apps/usb/device-1/"
                comment: "List applications on a USB device by id"
      - name: Fro
        cname: cmd_Fro
        summary: "Open a Frida session"
        description: >
          Opens a session for a frida:// URI on a local, USB, or remote device:
          attach to a pid or process name, spawn a target, or launch and resume
          it. USB/remote spawns resume before the command returns (`rn` true
          when RegisterNatives armed). A local spawn stays suspended. Stores
          the live session and emits a structured JSON reply.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: uri
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "Examples"
            entries:
              - text: "Froj "
                arg_str: "frida://attach/local//1234"
                comment: "Attach to local PID 1234"
              - text: "Froj "
                arg_str: "frida://attach/usb//com.example.app"
                comment: "Attach by process name on the single USB device"
              - text: "Froj "
                arg_str: "frida://spawn/usb//com.example.app"
                comment: "Spawn a USB package (resumed, rn true when the hook armed)"
              - text: "Froj "
                arg_str: "frida://launch/local///bin/ls"
                comment: "Launch /bin/ls and resume it immediately"
              - text: "Froj "
                arg_str: "frida://attach/remote/127.0.0.1:27042/1234"
                comment: "Attach to PID 1234 over a remote frida-server"
      - name: Frr
        cname: cmd_Frr
        summary: "Resume the open Frida session"
        description: >
          Resumes a target that was spawned suspended by the open command.
          Safe to repeat: a spawned target that is already running, including
          one resumed by open on a USB/remote spawn or by 'FrRNj on',
          returns ok rather than an error. Emits a structured JSON reply.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: Frc
        cname: cmd_Frc
        summary: "Close the open Frida session"
        description: >
          Detaches the open session and forgets it. A target that was spawned
          but never resumed is killed. An attached or launched target keeps
          running. Emits a structured JSON reply.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: Fre
        cname: cmd_Fre
        summary: "Evaluate JavaScript in the target process"
        description: >
          Loads the rz-frida agent into the open session on first use, then
          evaluates a JavaScript expression inside the target process and
          returns its value and type. Quote the expression when it contains
          spaces, or use Frlj for a script that lives in a file.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: source
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "Examples"
            entries:
              - text: "Frej "
                arg_str: "Process.arch"
                comment: "Read the target architecture from the agent"
              - text: "Frej "
                arg_str: "\"1 + 1\""
                comment: "Evaluate an expression, quote it when it has spaces"
      - name: Frl
        cname: cmd_Frl
        summary: "Load and evaluate a JavaScript file in the target process"
        description: >
          Reads a JavaScript file from disk and evaluates it inside the target
          process through the rz-frida agent. Useful for instrumentation
          scripts that are too large to pass on the command line.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: file
            type: RZ_CMD_ARG_TYPE_FILE
        details:
          - name: "Examples"
            entries:
              - text: "Frlj "
                arg_str: "hook.js"
                comment: "Evaluate hook.js inside the target process"
      - name: Fri
        cname: cmd_Fri
        summary: "Ping the agent in the target process"
        description: >
          Loads the rz-frida agent into the open session on first use and pings
          it, returning the agent version and the target platform, architecture,
          and pointer size. A quick way to check the host-agent message channel
          is alive.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: Frm
        cname: cmd_Frm
        summary: "Read buffered agent messages"
        description: >
          Drains the asynchronous output captured from the injected agent:
          console logs, uncaught script errors, and unsolicited send()
          notifications with any binary data. Returns them as a JSON array and
          clears the buffer.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: Frx
        cname: cmd_Frx
        summary: "Read target memory"
        description: >
          Reads a block of memory from the target process through the rz-frida
          agent and returns the bytes as a hex string. Loads the agent into the
          open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: address
            type: RZ_CMD_ARG_TYPE_NUM
          - name: size
            type: RZ_CMD_ARG_TYPE_NUM
        details:
          - name: "Examples"
            entries:
              - text: "Frxj "
                arg_str: "0x1000 64"
                comment: "Read 64 bytes at 0x1000 from the target process"
      - name: Frw
        cname: cmd_Frw
        summary: "Write target memory"
        description: >
          Writes a hex byte string into the target process memory through the
          rz-frida agent and returns the number of bytes written. Loads the
          agent into the open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: address
            type: RZ_CMD_ARG_TYPE_NUM
          - name: bytes
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "Examples"
            entries:
              - text: "Frwj "
                arg_str: "0x1000 deadbeef"
                comment: "Write the bytes 'de ad be ef' at 0x1000 in the target"
      - name: FrR
        cname: cmd_FrR
        summary: "List target memory ranges"
        description: >
          Lists the memory ranges of the target process through the rz-frida
          agent, each with its base, size, protection, and backing file when
          mapped. The agent caches the list and re-enumerates it after code runs
          in the target, pass any argument to force a fresh enumeration. Loads
          the agent into the open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: refresh
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "FrRj"
                comment: "List the cached target memory ranges"
              - text: "FrRj "
                arg_str: "refresh"
                comment: "Re-enumerate the ranges instead of using the cache"
      - name: Frt
        cname: cmd_Frt
        summary: "List target threads"
        description: >
          Lists the threads of the target process through the rz-frida agent,
          each with its id and state. Loads the agent into the open session on
          first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: FrM
        cname: cmd_FrM
        summary: "List target modules"
        description: >
          Lists the modules loaded in the target process through the rz-frida
          agent, each with its name, base, size, and path. The agent caches the
          list and re-enumerates it after code runs in the target, pass any
          argument to force a fresh enumeration. Loads the agent into the open
          session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: refresh
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "FrMj"
                comment: "List the cached target modules"
              - text: "FrMj "
                arg_str: "refresh"
                comment: "Re-enumerate the modules instead of using the cache"
      - name: FrE
        cname: cmd_FrE
        summary: "List target module exports"
        description: >
          Lists the exports of a module loaded in the target process through the
          rz-frida agent, each with its type, name, and address. Loads the agent
          into the open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: module
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "Examples"
            entries:
              - text: "FrEj "
                arg_str: "libc.so"
                comment: "List the exports of libc.so in the target"
      - name: FrI
        cname: cmd_FrI
        summary: "List target module imports"
        description: >
          Lists the imports of a module loaded in the target process through the
          rz-frida agent, each with its type, name, source module, and address.
          Loads the agent into the open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: module
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "Examples"
            entries:
              - text: "FrIj "
                arg_str: "libc.so"
                comment: "List the imports of libc.so in the target"
      - name: FrS
        cname: cmd_FrS
        summary: "List target module symbols"
        description: >
          Lists the symbols of a module loaded in the target process through the
          rz-frida agent, each with its name, address, and type. The list is
          empty for a module that carries no symbol table. Loads the agent into
          the open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: module
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "Examples"
            entries:
              - text: "FrSj "
                arg_str: "libc.so"
                comment: "List the symbols of libc.so in the target"
      - name: Frb
        cname: cmd_Frb
        summary: "Set or list native breakpoints"
        description: >
          Sets a breakpoint at an address in the target process through the
          rz-frida agent, or lists the breakpoints that are set when called with
          no argument. A hit is reported asynchronously through Frm with the
          breakpoint id and thread id (the event context is empty), and the thread
          stays parked until Frg continues it. Loads the agent into the open
          session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: address
            type: RZ_CMD_ARG_TYPE_NUM
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "Frbj "
                arg_str: "0x1000"
                comment: "Set a breakpoint at 0x1000 in the target"
              - text: "Frbj"
                comment: "List the breakpoints that are set"
      - name: Frb-
        cname: cmd_Frb_minus
        summary: "Remove native breakpoints"
        description: >
          Removes the breakpoint at an address in the target process through the
          rz-frida agent, or every breakpoint when the address is *. Loads the
          agent into the open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: address
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "Examples"
            entries:
              - text: "Frb-j "
                arg_str: "0x1000"
                comment: "Remove the breakpoint at 0x1000"
              - text: "Frb-j "
                arg_str: "*"
                comment: "Remove every breakpoint"
      - name: Frg
        cname: cmd_Frg
        summary: "Continue a thread parked at a breakpoint"
        description: >
          Continues a thread parked at a breakpoint in the target process
          through the rz-frida agent. With a thread id it continues that exact
          thread, with no argument it continues the most recently parked thread,
          and reports whether a thread was released. Loads the agent into the
          open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: thread
            type: RZ_CMD_ARG_TYPE_NUM
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "Frgj"
                comment: "Continue the most recently parked thread"
              - text: "Frgj "
                arg_str: "4242"
                comment: "Continue the thread with id 4242"
      - name: FrB
        cname: cmd_FrB
        summary: "Report stop identity or write a register at a breakpoint stop"
        description: >
          Reports the stop identity of a thread parked at a breakpoint in
          the target process through the rz-frida agent, or sets one register when
          a register name and value follow the thread id. A write lands on the
          live context and takes effect when the thread is continued with Frg.
          Loads the agent into the open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: thread
            type: RZ_CMD_ARG_TYPE_NUM
          - name: register
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
          - name: value
            type: RZ_CMD_ARG_TYPE_NUM
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "FrBj "
                arg_str: "4242"
                comment: "Report the stop identity of thread 4242"
              - text: "FrBj "
                arg_str: "4242 pc 0x401000"
                comment: "Set pc on thread 4242 before continuing it with Frgj"
      - name: FrW
        cname: cmd_FrW
        summary: "Set or list hardware watchpoints"
        description: >
          Sets a hardware watchpoint on an address in the target process through
          the rz-frida agent, or lists the watchpoints that are set when called
          with no argument. The optional size defaults to the pointer size and the
          optional conditions are r, w, or rw (default rw). The watchpoint is armed
          on every target thread, an access is reported asynchronously through
          Frm as a frida.wp event with the faulting thread, program counter, and
          register context, and the watchpoint disarms itself on that hit. The CPU
          has a small fixed number of watchpoint slots. Loads the agent into the
          open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: address
            type: RZ_CMD_ARG_TYPE_NUM
            optional: true
          - name: size
            type: RZ_CMD_ARG_TYPE_NUM
            optional: true
          - name: conditions
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "FrWj "
                arg_str: "0x1000"
                comment: "Watch the pointer-sized word at 0x1000 for reads and writes"
              - text: "FrWj "
                arg_str: "0x1000 8 w"
                comment: "Watch 8 bytes at 0x1000 for writes only"
              - text: "FrWj"
                comment: "List the watchpoints that are set"
      - name: FrW-
        cname: cmd_FrW_minus
        summary: "Remove hardware watchpoints"
        description: >
          Removes the hardware watchpoint at an address in the target process
          through the rz-frida agent, or every watchpoint when the address is *.
          Loads the agent into the open session on first use.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: address
            type: RZ_CMD_ARG_TYPE_STRING
        details:
          - name: "Examples"
            entries:
              - text: "FrW-j "
                arg_str: "0x1000"
                comment: "Remove the watchpoint at 0x1000"
              - text: "FrW-j "
                arg_str: "*"
                comment: "Remove every watchpoint"
      - name: FrJ
        cname: cmd_FrJ
        summary: "Check whether the Android Java VM is reachable"
        description: >
          Checks whether the Java VM (ART) is available in the target process and
          reports whether Java instrumentation is possible. Requires an Android
          target with the frida-java-bridge bundled into the agent.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: FrL
        cname: cmd_FrL
        summary: "Enumerate Java classloaders in the target"
        description: >
          Enumerates the classloaders in the target process through the rz-frida
          agent and assigns each one a stable integer id for the current session.
          Requires an Android target with the Java VM available.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: FrC
        cname: cmd_FrC
        summary: "Enumerate loaded Java classes in the target"
        description: >
          Enumerates the loaded Java classes in the target process through the
          rz-frida agent. An optional prefix matches classes whose canonical
          name starts with that string, or whose simple name after the last
          dot equals it. The frida.java.max config (default 512) caps the
          batch. Zero means unlimited.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: prefix
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
      - name: FrN
        cname: cmd_FrN
        summary: "Monitor newly loaded Java classes in the target"
        description: >
          When called without arguments, lists classes loaded since the last
          snapshot. Call 'FrNj start' to snapshot currently loaded classes.
          If the monitor is already enabled, start does not re-snapshot.
          Later listings are the difference against that set.
          Call 'FrNj stop' to disable the monitor. The seen set is kept, so
          a later listing can still report new names with monitor false.
          Requires an Android target with the Java VM available.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: mode
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
      - name: FrRN
        cname: cmd_FrRN
        summary: "Hook RegisterNatives to map native methods to addresses"
        description: >
          When called without arguments, lists captured JNI RegisterNatives
          invocations with className, method names, signatures and native
          function addresses. Call 'FrRNj on' to arm the low-level JNI
          hook on the ART runtime (JNI function table offset 215).
          A USB/remote spawn already arms it. On a still-suspended spawn, arming
          also resumes. 'FrRNj off' disarms and clears the buffer.
          'FrRNj import' imports the captured native method addresses
          into the rizin analysis class database.
          Requires an Android target with the Java VM available.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: mode
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
      - name: Frf
        cname: cmd_Frf
        summary: "Import runtime modules as rizin flags"
        description: >
          Enumerates the target process modules via the rz-frida agent and
          imports their base addresses into the frida.libs flag space as
          rizin flags. Returns the count of modules imported.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: FrX
        cname: cmd_FrX
        summary: "Compare static binary classes with runtime Frida classes"
        description: >
          Compares classes from a loaded binary (DEX, ELF, etc.) with classes
          enumerated at runtime through the Frida agent. Reports only_static
          (in binary but not runtime), only_runtime (runtime but not binary),
          and both (present in both) with per-category counts. An optional
          prefix filters both sides. If no binary is loaded, all runtime
          classes are reported as only_runtime with loaded_bin:false.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: prefix
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
      - name: FrD
        cname: cmd_FrD
        summary: "Describe a Java class in the target"
        description: >
          Describes a Java class in the target process through the rz-frida
          agent. Takes a fully qualified class name and an optional classloader
          id from a prior loader listing, extracts the superclass, interfaces,
          declared fields, declared methods, constructors, modifier flags, and
          Kotlin metadata when the class was compiled with the Kotlin compiler,
          and returns everything in a structured JSON envelope.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: class
            type: RZ_CMD_ARG_TYPE_CHOICES
            choices_cb: rz_frida_autocomplete_class
          - name: loader
            type: RZ_CMD_ARG_TYPE_NUM
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "FrDj "
                arg_str: "java.lang.String"
                comment: "Describe String using the default system loader, Tab to autocomplete class names"
              - text: "FrDj "
                arg_str: "com.example.Foo 3"
                comment: "Describe Foo loaded by classloader id 3"
      - name: FrIm
        cname: cmd_FrIm
        summary: "Import a Java class description into rizin analysis"
        description: >
          Describes a Java class in the target through the rz-frida agent and
          imports its name, superclass, methods, and constructors into the rizin
          analysis class database. After import the class is visible with ac and
          acl. Takes a fully qualified class name and an optional classloader id.
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: class
            type: RZ_CMD_ARG_TYPE_CHOICES
            choices_cb: rz_frida_autocomplete_class
          - name: loader
            type: RZ_CMD_ARG_TYPE_NUM
            optional: true
        details:
          - name: "Examples"
            entries:
              - text: "FrImj "
                arg_str: "java.lang.String"
                comment: "Import String using the default system loader, Tab to autocomplete class names"
              - text: "FrImj "
                arg_str: "com.example.Foo 3"
                comment: "Import Foo loaded by classloader id 3"
