  cutter-windows-x86_64-qt6:
    name: cutter plugin (windows-x86_64, qt6)
    runs-on: windows-latest
    needs: [test-gate, rizin-windows-x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Install Qt6
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          choco install pkgconfiglite -y
          $qtOut = Join-Path $env:RUNNER_TEMP "Qt"
          # aqt 3.3.0 cannot install Qt 6.11+, its online repo layout changed
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir $qtOut --modules qt5compat
          echo "QT_PREFIX=$qtOut\6.10.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Extract Cutter SDK
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 -o cutter.zip "https://github.com/rizinorg/cutter/releases/download/$env:CUTTER_VERSION/Cutter-$env:CUTTER_VERSION-Windows-x86_64.zip"
          7z x cutter.zip -oCutter
          $sdk = (Get-ChildItem -Path Cutter -Directory | Select-Object -First 1).FullName
          Get-ChildItem "$sdk\lib\pkgconfig\*.pc" | ForEach-Object {
            (Get-Content $_.FullName) -replace "^prefix=.*", "prefix=$($sdk -replace '\\','/')" | Set-Content $_.FullName
          }
          echo "CUTTER_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Install rizin plugin into SDK
        uses: actions/download-artifact@v8
        with:
          name: rz-frida-rizin-windows-x86_64
          path: rizin-plugin
      - name: Copy rizin plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CUTTER_SDK\lib\rizin\plugins" | Out-Null
          Copy-Item "rizin-plugin\rz_frida.*" "$env:CUTTER_SDK\lib\rizin\plugins\"

      - name: Build plugin
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "$env:CUTTER_SDK\lib\pkgconfig"
          $gen = (cmake --help | Select-String '(?<=\* )Visual Studio \d+ 20\d\d' | Select-Object -First 1 | ForEach-Object { $_.Matches[0].Value })
          if (-not $gen) {
            Write-Host "::error::no Visual Studio generator found"
            exit 1
          }
          cmake -S plugin/cutter -B build-cutter "-DCMAKE_PREFIX_PATH=$env:CUTTER_SDK;$env:QT_PREFIX" -G "$gen" -A x64
          cmake --build build-cutter --config Release

      - name: Smoke test (cutter loads plugin)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CUTTER_SDK\share\rizin\cutter\plugins\native" | Out-Null
          Copy-Item -Path "build-cutter\Release\cutter_frida_plugin.dll", "$env:CUTTER_SDK\lib\rizin\plugins\rz_frida.dll" -Destination "$env:CUTTER_SDK\share\rizin\cutter\plugins\native\"
          $app = Get-ChildItem -Path "$env:CUTTER_SDK" -Filter "Cutter.exe" -Recurse | Select-Object -First 1
          if (-not $app) {
            Write-Host "::error::Cutter.exe not found in SDK"
            exit 1
          }
          $p = Start-Process -FilePath $app.FullName -RedirectStandardOutput cutter.log -RedirectStandardError cutter.err.log -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "::error::Cutter exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          if (Select-String -Path cutter.log,cutter.err.log -Pattern "Load Error.*cutter_frida_plugin" -Quiet) {
            Write-Host "::error::Plugin load error detected in Cutter log"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-cutter-windows-x86_64-qt6
          path: build-cutter/Release/cutter_frida_plugin.dll
          if-no-files-found: error

  package-sources:
    name: Package sources
    runs-on: ubuntu-latest
    needs: test-gate
    steps:
      - uses: actions/checkout@v7

      - name: Create source archive
        run: |
          zip -r rz-frida-source.zip \
            meson.build meson_options.txt README.md LICENSES REUSE.toml plugin \
            -x "plugin/rizin/agent/node_modules/*" "plugin/rizin/agent/__pycache__/*" "*/build*/*" "*.o"

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-source
          path: rz-frida-source.zip
          if-no-files-found: error

  package-checksums:
    name: Package checksums
    runs-on: ubuntu-latest
    needs:
      - rizin-linux-x86_64
      - rizin-linux-arm64
      - rizin-macos-x86_64
      - rizin-macos-arm64
      - rizin-windows-x86_64
      - rizin-android
      - cutter-linux-x86_64-qt5
      - cutter-linux-x86_64-qt6
      - cutter-macos-x86_64-qt6
      - cutter-macos-arm64-qt6
      - cutter-windows-x86_64-qt6
      - package-sources
    steps:
      - uses: actions/download-artifact@v8

      - name: Generate SHA256SUMS
        run: |
          find . \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" -o -name "*.zip" -o -name "rizin" \) -type f | sort | while read f; do
            rel=${f#./}
            case "$rel" in
              rz-frida-*/*) sha256sum "$f" | awk '{print $1"  "$2}' ;;
            esac
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - rizin-linux-x86_64
      - rizin-linux-arm64
      - rizin-macos-x86_64
      - rizin-macos-arm64
      - rizin-windows-x86_64
      - rizin-android
      - cutter-linux-x86_64-qt5
      - cutter-linux-x86_64-qt6
      - cutter-macos-x86_64-qt6
      - cutter-macos-arm64-qt6
      - cutter-windows-x86_64-qt6
      - package-sources
      - package-checksums
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    steps:
      - uses: actions/download-artifact@v8

      - name: Resolve tag and name
        id: meta
        shell: pwsh
        env:
          RAW_RELEASE_TAG: ${{ inputs.release_tag }}
          RAW_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          $requestedTag = [string]$env:RAW_RELEASE_TAG
          $requestedTag = $requestedTag.Trim()
          if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            Write-Error "release_tag is required when publish_release=true"
            exit 1
          }
          $name = ([string]$env:RAW_RELEASE_NAME).Trim()
          if ([string]::IsNullOrWhiteSpace($name)) {
            $name = $requestedTag
          }
          $normalizedTag = $requestedTag
          if (-not $normalizedTag.StartsWith("v")) {
            $normalizedTag = "v$normalizedTag"
          }
          $normalizedTag = [regex]::Replace($normalizedTag.Trim(), "\s+", "-")
          $normalizedTag = [regex]::Replace($normalizedTag, "[^0-9A-Za-z._/-]", "-")
          $normalizedTag = [regex]::Replace($normalizedTag, "-{2,}", "-")
          $normalizedTag = $normalizedTag.Trim('-')
          if ([string]::IsNullOrWhiteSpace($normalizedTag) -or $normalizedTag -eq "v") {
            Write-Error "release_tag could not be normalized into a valid Git tag"
            exit 1
          }
          "tag=$normalizedTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_commitish=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ steps.meta.outputs.target_commitish }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: |
            rz-frida-rizin-*/*
            rz-frida-cutter-*/*
            rz-frida-source/*
            rz-frida-checksums/*
