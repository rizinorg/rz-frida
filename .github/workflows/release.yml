            -Dfrida_library="$(pwd)/frida-core-devkit/libfrida-core.a"
          ninja -C build
          sudo ninja -C build install

      - name: Smoke test (local attach)
        run: |
          # frida local attach needs ptrace, disable yama restrictions
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          sleep 30 &
          target=$!
          out=$(rizin -N -q -c "fridaoj attach/local//${target}" -c "fridasj" -c "fridaRj" -c "fridacj" malloc://512 2>&1)
          kill $target 2>/dev/null || true
          echo "$out"
          echo "$out" | grep -q '"ok":true' || exit 1
          echo "$out" | grep -q '"ranges"' || exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-rizin-linux-arm64
          path: build/plugin/rizin/librz_frida.so
          if-no-files-found: error

  rizin-macos-x86_64:
    name: rizin plugin (macos-x86_64)
    runs-on: macos-15-intel
    needs: test-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Build rizin
        run: |
          command -v pkg-config || brew install pkg-config
          pip3 install meson ninja
          curl -sL -o rizin-src.tar.xz "https://github.com/rizinorg/rizin/releases/download/${RIZIN_VERSION}/rizin-src-${RIZIN_VERSION}.tar.xz"
          tar xf rizin-src.tar.xz
          cd rizin-${RIZIN_VERSION}
          meson setup build -Dblob=true
          ninja -C build
          sudo ninja -C build install
          cd ..

      - name: Build plugin
        run: |
          curl -sL -o frida-devkit.tar.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-macos-x86_64.tar.xz"
          mkdir -p frida-core-devkit
          tar xf frida-devkit.tar.xz -C frida-core-devkit
          meson setup build \
            -Dfrida_core=enabled \
            -Dfrida_include_dir="$(pwd)/frida-core-devkit" \
            -Dfrida_library="$(pwd)/frida-core-devkit/libfrida-core.a"
          ninja -C build
          sudo ninja -C build install

      - name: Smoke test (local attach as root)
        run: |
          # hosted runners deny task_for_pid for non-root, attach as root instead
          python3 -c "import time; time.sleep(30)" &
          target=$!
          out=$(sudo rizin -N -q -c "fridaoj attach/local//${target}" -c "fridasj" -c "fridaRj" -c "fridacj" malloc://512 2>&1)
          kill $target 2>/dev/null || true
          echo "$out"
          echo "$out" | grep -q '"action":"attach"' || exit 1
          echo "$out" | grep -q '"state":"attached"' || exit 1
          echo "$out" | grep -q '"ranges"' || exit 1

      - name: Smoke test (local attach as user)
        run: |
          # non-root attach should work on a normal mac, on a hosted runner it fails cleanly
          python3 -c "import time; time.sleep(30)" &
          target=$!
          out=$(rizin -N -q -c "fridaoj attach/local//${target}" -c "fridasj" -c "fridaRj" malloc://512 2>&1)
          kill $target 2>/dev/null || true
          echo "$out"
          if echo "$out" | grep -q '"action":"attach"'; then
            echo "$out" | grep -q '"state":"attached"' || exit 1
            echo "$out" | grep -q '"ranges"' || exit 1
          else
            echo "$out" | grep -q '"ok":false' || exit 1
            echo "$out" | grep -q '"error"' || exit 1
            echo "$out" | grep -q '"no session is open"' || exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-rizin-macos-x86_64
          path: build/plugin/rizin/librz_frida.dylib
          if-no-files-found: error

  rizin-macos-arm64:
    name: rizin plugin (macos-arm64)
    runs-on: macos-14
    needs: test-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Build rizin
        run: |
          command -v pkg-config || brew install pkg-config
          pip3 install meson ninja
          curl -sL -o rizin-src.tar.xz "https://github.com/rizinorg/rizin/releases/download/${RIZIN_VERSION}/rizin-src-${RIZIN_VERSION}.tar.xz"
          tar xf rizin-src.tar.xz
          cd rizin-${RIZIN_VERSION}
          meson setup build -Dblob=true
          ninja -C build
          sudo ninja -C build install
          cd ..

      - name: Build plugin
        run: |
          curl -sL -o frida-devkit.tar.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-macos-arm64.tar.xz"
          mkdir -p frida-core-devkit
          tar xf frida-devkit.tar.xz -C frida-core-devkit
          meson setup build \
            -Dfrida_core=enabled \
            -Dfrida_include_dir="$(pwd)/frida-core-devkit" \
            -Dfrida_library="$(pwd)/frida-core-devkit/libfrida-core.a"
          ninja -C build
          sudo ninja -C build install

      - name: Smoke test (local attach as root)
        run: |
          # hosted runners deny task_for_pid for non-root, attach as root instead
          python3 -c "import time; time.sleep(30)" &
          target=$!
          out=$(sudo rizin -N -q -c "fridaoj attach/local//${target}" -c "fridasj" -c "fridaRj" -c "fridacj" malloc://512 2>&1)
          kill $target 2>/dev/null || true
          echo "$out"
          echo "$out" | grep -q '"action":"attach"' || exit 1
          echo "$out" | grep -q '"state":"attached"' || exit 1
          echo "$out" | grep -q '"ranges"' || exit 1

      - name: Smoke test (local attach as user)
        run: |
          # non-root attach should work on a normal mac, on a hosted runner it fails cleanly
          python3 -c "import time; time.sleep(30)" &
          target=$!
          out=$(rizin -N -q -c "fridaoj attach/local//${target}" -c "fridasj" -c "fridaRj" malloc://512 2>&1)
          kill $target 2>/dev/null || true
          echo "$out"
          if echo "$out" | grep -q '"action":"attach"'; then
            echo "$out" | grep -q '"state":"attached"' || exit 1
            echo "$out" | grep -q '"ranges"' || exit 1
          else
            echo "$out" | grep -q '"ok":false' || exit 1
            echo "$out" | grep -q '"error"' || exit 1
            echo "$out" | grep -q '"no session is open"' || exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-rizin-macos-arm64
          path: build/plugin/rizin/librz_frida.dylib
          if-no-files-found: error

  rizin-windows-x86_64:
    name: rizin plugin (windows-x86_64)
    runs-on: windows-latest
    needs: test-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Install meson and pkg-config
        shell: pwsh
        run: |
          python -m pip install meson ninja
          choco install pkgconfiglite -y

      - name: Extract rizin SDK
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 -o rizin.zip "https://github.com/rizinorg/rizin/releases/download/$env:RIZIN_VERSION/rizin-windows-shared64-$env:RIZIN_VERSION.zip"
          7z x rizin.zip -orizin-sdk
          $sdk = Resolve-Path "rizin-sdk\rizin-win-installer-clang_cl-64"
          # the .pc files embed the builder's CI path, point them at this checkout
          Get-ChildItem "$sdk\lib\pkgconfig\*.pc" | ForEach-Object {
            (Get-Content $_.FullName) -replace "^prefix=.*", "prefix=$($sdk.Path -replace '\\','/')" | Set-Content $_.FullName
          }
          Add-Content $env:GITHUB_ENV "RIZIN_SDK=$($sdk.Path)"

      - name: Build plugin
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 -o frida.tar.xz "https://github.com/frida/frida/releases/download/$env:FRIDA_VERSION/frida-core-devkit-$env:FRIDA_VERSION-windows-x86_64.tar.xz"
          mkdir frida-core-devkit
          # bsdtar might hang on CI while extracting this archive,
          # so use 7zip first, then tar, then tarfile.
          $ok = $false
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (Test-Path -Path $sevenZip -PathType Leaf) {
            & $sevenZip x -y "-ofrida-core-devkit" frida.tar.xz | Out-Null
            $ok = Test-Path -Path 'frida-core-devkit\frida-core.h' -PathType Leaf
            if (-not $ok) {
              foreach ($innerTar in @('frida.tar', 'frida-core-devkit\frida.tar')) {
                if (Test-Path -Path $innerTar -PathType Leaf) {
                  & $sevenZip x -y "-ofrida-core-devkit" $innerTar | Out-Null
                  Remove-Item -Force $innerTar -ErrorAction SilentlyContinue
                  $ok = Test-Path -Path 'frida-core-devkit\frida-core.h' -PathType Leaf
                  if ($ok) { break }
                }
              }
            }
          }
          $gitTar = 'C:\Program Files\Git\usr\bin\tar.exe'
          if (-not $ok -and (Test-Path -Path $gitTar -PathType Leaf)) {
            & $gitTar xf frida.tar.xz -C frida-core-devkit
            $ok = Test-Path -Path 'frida-core-devkit\frida-core.h' -PathType Leaf
          }
          if (-not $ok -and (Get-Command python -ErrorAction SilentlyContinue)) {
            python -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2])" `
              frida.tar.xz frida-core-devkit
            $ok = Test-Path -Path 'frida-core-devkit\frida-core.h' -PathType Leaf
          }
          # cleanup
          Remove-Item -Force 'frida.tar', 'frida-core-devkit\frida.tar' -ErrorAction SilentlyContinue
          if (-not $ok) {
            Get-ChildItem -Recurse frida-core-devkit | Select-Object -First 20 FullName
            throw "frida-core devkit extraction failed: frida-core.h not found in frida-core-devkit"
          }
          $env:PKG_CONFIG_PATH = "$env:RIZIN_SDK\lib\pkgconfig"
          # release buildtype picks /MD CRT, same as release rizin SDK
          meson setup build --vsenv --buildtype=release `
            -Dfrida_core=enabled `
            -Dfrida_include_dir="$(Get-Location)\frida-core-devkit" `
            -Dfrida_library="$(Get-Location)\frida-core-devkit\frida-core.lib"
          meson compile -C build

      - name: Smoke test (local attach)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RIZIN_SDK\lib\rizin\plugins" | Out-Null
          Copy-Item "build\plugin\rizin\rz_frida.dll" "$env:RIZIN_SDK\lib\rizin\plugins\"
          $helper = Start-Process -FilePath "cmd.exe" -ArgumentList "/c ping -t 127.0.0.1" -PassThru
          try {
            $out = & "$env:RIZIN_SDK\bin\rizin.exe" -N -q -c "fridaoj attach/local//$($helper.Id)" -c "fridasj" -c "fridaRj" -c "fridacj" malloc://512 2>&1 | Out-String
            Write-Host $out
            if ($out -notmatch '"ok":true' -or $out -notmatch '"ranges"') { exit 1 }
          } finally {
            Stop-Process -Id $helper.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-rizin-windows-x86_64
          path: build/plugin/rizin/rz_frida.*
          if-no-files-found: error

  rizin-android:
    name: rizin plugin (android-${{ matrix.abi }})
    runs-on: ubuntu-24.04
    needs: test-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: aarch64
            frida: android-arm64
            machine: AArch64
          - abi: arm
            frida: android-arm
            machine: ARM
          - abi: x86_64
            frida: android-x86_64
            machine: X86-64
    env:
      ANDROID_STAGING: ${{ github.workspace }}/android-staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Build rizin for android
        run: |
          pip install meson ninja
          # the runner's ANDROID_NDK_LATEST_HOME holds the latest NDK path
          test -n "$ANDROID_NDK_LATEST_HOME" || { echo "::error::ANDROID_NDK_LATEST_HOME is not set"; exit 1; }
          sed -i "s@\${ANDROID_NDK_LATEST_HOME}@${ANDROID_NDK_LATEST_HOME}@g" .github/meson-android-${{ matrix.abi }}.ini
          wget -q "https://github.com/rizinorg/rizin/releases/download/${RIZIN_VERSION}/rizin-src-${RIZIN_VERSION}.tar.xz"
          tar xf rizin-src-${RIZIN_VERSION}.tar.xz
          cd rizin-${RIZIN_VERSION}
          # shared rizin on purpose, a static build cannot load the plugin
          meson setup --buildtype release --prefix=${ANDROID_STAGING} \
            -Dblob=true build --cross-file ../.github/meson-android-${{ matrix.abi }}.ini
          ninja -C build
          ninja -C build install
          cd ..

      - name: Build plugin for android
        run: |
          sed -i "s@\${ANDROID_NDK_LATEST_HOME}@${ANDROID_NDK_LATEST_HOME}@g; s@\${ANDROID_STAGING}@${ANDROID_STAGING}@g" .github/meson-plugin-android-${{ matrix.abi }}.ini
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-${{ matrix.frida }}.tar.xz"
          mkdir -p frida-core-devkit
          tar xf frida-core-devkit-${FRIDA_VERSION}-${{ matrix.frida }}.tar.xz -C frida-core-devkit
          meson setup build-android \
            --cross-file .github/meson-plugin-android-${{ matrix.abi }}.ini \
            -Dfrida_core=enabled \
            -Dfrida_include_dir="$(pwd)/frida-core-devkit" \
            -Dfrida_library="$(pwd)/frida-core-devkit/libfrida-core.a" \
            -Drizin_plugdir="${ANDROID_STAGING}/lib/rizin/plugins"
          ninja -C build-android
          ninja -C build-android install

      - name: Verify artifact
        run: |
          file build-android/plugin/rizin/librz_frida.so
          # readelf names x86_64 'Advanced Micro Devices X86-64', hence substring match
          readelf -h build-android/plugin/rizin/librz_frida.so | grep -qi "${{ matrix.machine }}"
          # rz_* resolves at runtime against librz_core.so
          ! nm -D build-android/plugin/rizin/librz_frida.so | grep " U " | grep -q "frida"

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-rizin-android-${{ matrix.abi }}
          path: |
            ${{ env.ANDROID_STAGING }}/bin
            ${{ env.ANDROID_STAGING }}/lib
          if-no-files-found: error

  cutter-linux-x86_64-qt5:
    name: cutter plugin (linux-x86_64, qt5)
    runs-on: ubuntu-24.04
    needs: [test-gate, rizin-linux-x86_64]
    env:
      CUTTER_SDK: ${{ github.workspace }}/squashfs-root/usr
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt5
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev libqt5svg5-dev pkg-config xvfb

      - name: Extract Cutter SDK
        run: |
          wget -q "https://github.com/rizinorg/cutter/releases/download/${CUTTER_VERSION}/Cutter-${CUTTER_VERSION}-Linux-Qt5-x86_64.AppImage"
          chmod +x Cutter-${CUTTER_VERSION}-Linux-Qt5-x86_64.AppImage
          ./Cutter-${CUTTER_VERSION}-Linux-Qt5-x86_64.AppImage --appimage-extract > /dev/null
          # the .pc files embed the builder's CI path, point them at this checkout
          for f in squashfs-root/usr/lib/pkgconfig/*.pc; do
            sed -i "s|^prefix=.*|prefix=${CUTTER_SDK}|" "$f"
          done

      - name: Install rizin plugin into SDK
        uses: actions/download-artifact@v8
        with:
          name: rz-frida-rizin-linux-x86_64
          path: rizin-plugin
      - name: Copy rizin plugin
        run: |
          sudo mkdir -p ${CUTTER_SDK}/lib/rizin/plugins
          sudo cp rizin-plugin/librz_frida.so ${CUTTER_SDK}/lib/rizin/plugins/

      - name: Build plugin
        env:
          PKG_CONFIG_PATH: ${CUTTER_SDK}/lib/pkgconfig
        run: |
          cmake -S plugin/cutter -B build-cutter -DCMAKE_PREFIX_PATH=${CUTTER_SDK}
          cmake --build build-cutter

      - name: Smoke test (cutter load)
        run: |
          sudo cp build-cutter/libcutter_frida_plugin.so ${CUTTER_SDK}/share/rizin/cutter/plugins/native/
          xvfb-run -a ./squashfs-root/usr/bin/cutter /bin/true > cutter.log 2>&1 &
          pid=$!
          sleep 25
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          grep -q "Load Error.*libcutter_frida_plugin" cutter.log && exit 1 || true

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-cutter-linux-x86_64-qt5
          path: build-cutter/libcutter_frida_plugin.so
          if-no-files-found: error

  cutter-linux-x86_64-qt6:
    name: cutter plugin (linux-x86_64, qt6)
    runs-on: ubuntu-24.04
    needs: [test-gate, rizin-linux-x86_64]
    env:
      CUTTER_SDK: ${{ github.workspace }}/squashfs-root/usr
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-svg-dev qt6-5compat-dev pkg-config xvfb

      - name: Extract Cutter SDK
        run: |
          wget -q "https://github.com/rizinorg/cutter/releases/download/${CUTTER_VERSION}/Cutter-${CUTTER_VERSION}-Linux-x86_64.AppImage"
          chmod +x Cutter-${CUTTER_VERSION}-Linux-x86_64.AppImage
          ./Cutter-${CUTTER_VERSION}-Linux-x86_64.AppImage --appimage-extract > /dev/null
          for f in squashfs-root/usr/lib/pkgconfig/*.pc; do
            sed -i "s|^prefix=.*|prefix=${CUTTER_SDK}|" "$f"
          done

      - name: Install rizin plugin into SDK
        uses: actions/download-artifact@v8
        with:
          name: rz-frida-rizin-linux-x86_64
          path: rizin-plugin
      - name: Copy rizin plugin
        run: |
          sudo mkdir -p ${CUTTER_SDK}/lib/rizin/plugins
          sudo cp rizin-plugin/librz_frida.so ${CUTTER_SDK}/lib/rizin/plugins/

      - name: Build plugin
        env:
          PKG_CONFIG_PATH: ${CUTTER_SDK}/lib/pkgconfig
        run: |
          cmake -S plugin/cutter -B build-cutter -DCMAKE_PREFIX_PATH=${CUTTER_SDK}
          cmake --build build-cutter

      - name: Smoke test (cutter load)
        run: |
          sudo cp build-cutter/libcutter_frida_plugin.so ${CUTTER_SDK}/share/rizin/cutter/plugins/native/
          xvfb-run -a ./squashfs-root/usr/bin/cutter /bin/true > cutter.log 2>&1 &
          pid=$!
          sleep 25
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          grep -q "Load Error.*libcutter_frida_plugin" cutter.log && exit 1 || true

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-cutter-linux-x86_64-qt6
          path: build-cutter/libcutter_frida_plugin.so
          if-no-files-found: error

