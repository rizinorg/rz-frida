name: Release

# Builds and tests the rizin and cutter plugins 
# and optionally publishes a GitHub release.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag or version label (required if publish_release=true)"
        required: false
        type: string
      release_name:
        description: "Release name override"
        required: false
        type: string
  pull_request:
    branches:
      - '**release**'
  push:
    branches:
      - '**release**'

# Dependency pins, bumped by the update-deps workflow.
env:
  RIZIN_VERSION: v0.9.1
  FRIDA_VERSION: 17.17.0
  CUTTER_VERSION: v2.5.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-gate:
    name: Test gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }

      - name: Install rizin
        run: |
          pip install meson ninja PyYAML
          wget -q "https://github.com/rizinorg/rizin/releases/download/${RIZIN_VERSION}/rizin-src-${RIZIN_VERSION}.tar.xz"
          tar xf rizin-src-${RIZIN_VERSION}.tar.xz
          cd rizin-${RIZIN_VERSION}
          meson setup build --prefix=/usr -Dblob=true
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..

      - name: Build with frida-core
        run: |
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-linux-x86_64.tar.xz"
          mkdir -p frida-core-devkit
          tar xf frida-core-devkit-${FRIDA_VERSION}-linux-x86_64.tar.xz -C frida-core-devkit
          meson setup build \
            -Dfrida_core=enabled \
            -Dfrida_include_dir="$(pwd)/frida-core-devkit" \
            -Dfrida_library="$(pwd)/frida-core-devkit/libfrida-core.a"
          ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  rizin-linux-x86_64:
    name: rizin plugin (linux-x86_64)
    runs-on: ubuntu-24.04
    needs: test-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Build rizin
        run: |
          pip install meson ninja
          wget -q "https://github.com/rizinorg/rizin/releases/download/${RIZIN_VERSION}/rizin-src-${RIZIN_VERSION}.tar.xz"
          tar xf rizin-src-${RIZIN_VERSION}.tar.xz
          cd rizin-${RIZIN_VERSION}
          meson setup build --prefix=/usr -Dblob=true
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..

      - name: Build plugin
        run: |
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-linux-x86_64.tar.xz"
          mkdir -p frida-core-devkit
          tar xf frida-core-devkit-${FRIDA_VERSION}-linux-x86_64.tar.xz -C frida-core-devkit
          meson setup build \
            --prefix=/usr \
            -Dfrida_core=enabled \
            -Dfrida_include_dir="$(pwd)/frida-core-devkit" \
            -Dfrida_library="$(pwd)/frida-core-devkit/libfrida-core.a"
          ninja -C build
          sudo ninja -C build install

      - name: Smoke test (local attach)
        run: |
          # frida local attach needs ptrace, disable yama restrictions
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          sleep 30 &
          target=$!
          out=$(rizin -N -q -c "fridaoj attach/local//${target}" -c "fridasj" -c "fridaRj" -c "fridacj" malloc://512 2>&1)
          kill $target 2>/dev/null || true
          echo "$out"
          echo "$out" | grep -q '"ok":true' || exit 1
          echo "$out" | grep -q '"ranges"' || exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: rz-frida-rizin-linux-x86_64
          path: build/plugin/rizin/librz_frida.so
          if-no-files-found: error

  rizin-linux-arm64:
    name: rizin plugin (linux-arm64)
    runs-on: ubuntu-24.04-arm
    needs: test-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Build rizin
        run: |
          pip install meson ninja
          wget -q "https://github.com/rizinorg/rizin/releases/download/${RIZIN_VERSION}/rizin-src-${RIZIN_VERSION}.tar.xz"
          tar xf rizin-src-${RIZIN_VERSION}.tar.xz
          cd rizin-${RIZIN_VERSION}
          meson setup build --prefix=/usr -Dblob=true
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..

      - name: Build plugin
        run: |
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-linux-arm64.tar.xz"
          mkdir -p frida-core-devkit
          tar xf frida-core-devkit-${FRIDA_VERSION}-linux-arm64.tar.xz -C frida-core-devkit
          meson setup build \
