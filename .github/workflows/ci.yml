name: CI

on:
  push:
    branches: [dev, stable]
  pull_request:
  workflow_dispatch:

# Dependency pins, bumped by update-deps workflow.
# dev builds rizin from its dev branch, stable uses the pinned release.
# RIZIN_DEV_REF can be a branch name or a commit sha (just-in-case).
# PRs use the base branch, pushes/dispatches use the ref.
env:
  RIZIN_VERSION: v0.9.1
  RIZIN_DEV_REF: dev
  FRIDA_VERSION: 17.17.0
  RIZIN_FLAVOR: ${{ (github.base_ref == 'dev' || github.ref_name == 'dev') && 'dev' || 'release' }}

jobs:
  linux-frida:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }

      - name: Install rizin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip install meson ninja PyYAML
          if [ "$RIZIN_FLAVOR" = dev ]; then
            curl -fsSL "https://github.com/rizinorg/rizin/archive/${RIZIN_DEV_REF}.tar.gz" -o rizin-dev.tar.gz
            mkdir -p rizin-dev-src
            tar xf rizin-dev.tar.gz -C rizin-dev-src --strip-components=1
            src=rizin-dev-src
            echo "rizin dev ref: ${RIZIN_DEV_REF} ($(gh api "repos/rizinorg/rizin/commits/${RIZIN_DEV_REF}" --jq .sha 2>/dev/null || echo unknown))"
          else
            wget -q "https://github.com/rizinorg/rizin/releases/download/${RIZIN_VERSION}/rizin-src-${RIZIN_VERSION}.tar.xz"
            tar xf "rizin-src-${RIZIN_VERSION}.tar.xz"
            src="rizin-${RIZIN_VERSION}"
            echo "rizin release: ${RIZIN_VERSION}"
          fi
          meson setup "$src/build" "$src" --prefix=/usr -Dblob=true
          ninja -C "$src/build"
          sudo ninja -C "$src/build" install

      - name: Build (with frida-core)
        run: |
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-linux-x86_64.tar.xz"
          mkdir -p frida-core-devkit-${FRIDA_VERSION}
          tar xf frida-core-devkit-${FRIDA_VERSION}-linux-x86_64.tar.xz -C frida-core-devkit-${FRIDA_VERSION}
          meson setup build \
            -Dfrida_core=enabled \
            -Dfrida_include_dir="$(pwd)/frida-core-devkit-${FRIDA_VERSION}" \
            -Dfrida_library="$(pwd)/frida-core-devkit-${FRIDA_VERSION}/libfrida-core.a"
          ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  linux-no-frida:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }

      - name: Install rizin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip install meson ninja PyYAML
          if [ "$RIZIN_FLAVOR" = dev ]; then
            curl -fsSL "https://github.com/rizinorg/rizin/archive/${RIZIN_DEV_REF}.tar.gz" -o rizin-dev.tar.gz
            mkdir -p rizin-dev-src
            tar xf rizin-dev.tar.gz -C rizin-dev-src --strip-components=1
            src=rizin-dev-src
            echo "rizin dev ref: ${RIZIN_DEV_REF} ($(gh api "repos/rizinorg/rizin/commits/${RIZIN_DEV_REF}" --jq .sha 2>/dev/null || echo unknown))"
          else
            wget -q "https://github.com/rizinorg/rizin/releases/download/${RIZIN_VERSION}/rizin-src-${RIZIN_VERSION}.tar.xz"
            tar xf "rizin-src-${RIZIN_VERSION}.tar.xz"
            src="rizin-${RIZIN_VERSION}"
            echo "rizin release: ${RIZIN_VERSION}"
          fi
          meson setup "$src/build" "$src" --prefix=/usr -Dblob=true
          ninja -C "$src/build"
          sudo ninja -C "$src/build" install

      - name: Build (without frida-core)
        run: |
          meson setup build -Dfrida_core=disabled
          ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs
