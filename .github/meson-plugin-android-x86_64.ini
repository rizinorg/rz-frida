# Cross-file for building the rz-frida rizin plugin for Android x86_64.

[binaries]
c       = '${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang'
cpp     = '${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang++'
ar      = '${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
ranlib  = '${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
strip   = '${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android-strip'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['${ANDROID_STAGING}/lib/pkgconfig']

[host_machine]
system = 'android'
cpu_family = 'x86'
cpu = 'x86_64'
endian = 'little'
